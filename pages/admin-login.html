<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Staff Login | SLNA</title><link rel="stylesheet" href="../css/style.css"></head>
<body class="admin-body">
  <div class="login-wrap">
    <div class="admin-card">
      <div style="text-align:center; margin-bottom:18px;">
        <div class="logo-badge" style="margin:0 auto 10px;"><img src="../images/slna-logo.jpg" alt="SLNA Logo"></div>
        <h2 style="margin-bottom:4px; font-size:18px; color:var(--primary-dark);">SLNA Staff Login</h2>
      </div>
      <div id="login-alert"></div>
      <form id="login-form">
        <div class="form-group"><label>Username</label><input type="text" id="login-username" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="login-password" required></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
      </form>
      <p style="text-align:center; margin-top:14px; font-size:12.5px;"><a href="../index.html" style="color:var(--primary); font-weight:600;">&larr; Back to website</a></p>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const success = await attemptLogin(username, password);
      if (success) { window.location.href = 'admin-dashboard.html'; }
      else { document.getElementById('login-alert').innerHTML = '<div class="alert alert-error">Invalid username or password.</div>'; }
    });
  </script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Photo Gallery | SLNA</title><meta name="description" content="Photo albums from events and activities of the Sri Lanka Nurses Association."><link rel="icon" type="image/png" sizes="48x48" href="../images/favicon-48.png"><link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png"><link rel="apple-touch-icon" href="../images/apple-touch-icon.png"><link rel="stylesheet" href="../css/style.css"></head>
</head>
<body>
<div id="site-header"></div>

<div class="page-hero page-hero-compact"><div class="container"><div class="breadcrumb"><a href="../index.html">Home</a> / <span>Photo Gallery</span></div></div></div><div class="container" style="padding:44px 20px;"><h1 class="page-title">Photo Gallery</h1>
<!-- All: every photo and video from every album. Albums: one card per album. -->
<div class="gallery-bar">
  <div class="gallery-views" role="radiogroup" aria-label="Gallery view">
    <label><input type="radio" name="gallery-view" value="all" checked> All</label>
    <label><input type="radio" name="gallery-view" value="albums"> Albums</label>
  </div>
  <p class="gallery-count" id="gallery-count" aria-live="polite"></p>
</div>
<div id="gallery-all-container"><div class="news-empty">Loading gallery...</div></div>
<div class="album-grid" id="album-grid-container" hidden></div>
</div>
<div class="lightbox-overlay" id="lightbox-overlay">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <span class="lightbox-counter" id="lightbox-counter"></span>
  <button class="lightbox-nav lightbox-prev" onclick="lightboxPrev()">&#8249;</button>
  <div class="lightbox-content"><img id="lightbox-img" src="" alt=""><video id="lightbox-video" controls style="display:none;"></video></div>
  <button class="lightbox-nav lightbox-next" onclick="lightboxNext()">&#8250;</button>
</div>

<div id="site-footer"></div>

<script src="../js/vendor/purify.min.js"></script>
<script src="../js/news.js"></script>
<script src="../js/config.js"></script>
<script src="../js/include-header.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
